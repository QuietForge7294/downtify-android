name: Delivery and USB tools

on:
  pull_request:
    paths:
      - 'tools/automation/**'
      - '.github/workflows/automation-tools.yml'
  push:
    branches: [main, master]
    paths:
      - 'tools/automation/**'
      - '.github/workflows/automation-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/automation/tests -v
